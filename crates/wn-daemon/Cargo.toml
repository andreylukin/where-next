[package]
name = "wn-daemon"
description = "Resident process keeping the model and index warm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["onnx"]
onnx = ["dep:wn-embed"]

[dependencies]
wn-embed = { path = "../wn-embed", optional = true }
wn-core.workspace = true
wn-sources = { path = "../wn-sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest.workspace = true
proptest-state-machine.workspace = true
tempfile = "3"

[lints]
workspace = true
