[package]
name = "wn-mcp"
description = "MCP server exposing where_next to coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["onnx"]
onnx = ["dep:wn-embed"]

[[bin]]
name = "wn-mcp-server"
required-features = ["onnx"]

[dependencies]
wn-core.workspace = true
wn-daemon = { version = "0.2.0", path = "../wn-daemon" }
wn-embed = { version = "0.2.0", path = "../wn-embed", optional = true }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time"] }
tempfile = "3"

[lints]
workspace = true
