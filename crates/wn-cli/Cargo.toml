[package]
name = "wn-cli"
description = "The `wn` command"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "wn_cli"
path = "src/lib.rs"

[[bin]]
name = "wn"
path = "src/main.rs"

[features]
default = ["onnx"]
onnx = ["dep:wn-embed", "wn-mcp/onnx"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wn-core.workspace = true
wn-git = { path = "../wn-git" }
wn-sources = { path = "../wn-sources" }
wn-daemon = { path = "../wn-daemon" }
wn-embed = { path = "../wn-embed", optional = true }
wn-mcp = { path = "../wn-mcp", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
insta = { version = "1.48", features = ["filters"] }
tempfile = "3"

[lints]
workspace = true
