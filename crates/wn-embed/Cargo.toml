[package]
name = "wn-embed"
description = "Embedding backends (ONNX Runtime), model download and verification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["onnx"]
# ONNX Runtime backend. Downloads prebuilt ONNX Runtime binaries at build time.
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
wn-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.13", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
wn-sources = { path = "../wn-sources" }
proptest.workspace = true
proptest-state-machine.workspace = true
tempfile = "3"

[lints]
workspace = true
