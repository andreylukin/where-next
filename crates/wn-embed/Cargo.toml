[package]
name = "wn-embed"
description = "Embedding backends (ONNX Runtime), model download and verification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["onnx"]
# ONNX Runtime backend. Linux loads a shared library; other targets link prebuilt binaries.
onnx = ["dep:ort", "dep:tokenizers"]
# HTTP(S) model downloads (`wn model pull` from a URL or Hugging Face repo).
remote = ["dep:ureq"]

[dependencies]
wn-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, features = ["load-dynamic"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true }

[dev-dependencies]
wn-sources = { version = "0.2.0", path = "../wn-sources" }
proptest.workspace = true
proptest-state-machine.workspace = true
tempfile = "3"

[lints]
workspace = true
