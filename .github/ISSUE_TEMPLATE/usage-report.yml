name: Usage report
description: Share an anonymous usage report generated by `wn report` (numbers and buckets only).
title: "usage report: wn"
labels: ["usage-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve where-next. `wn report` fills this in for you.
        The report contains **only** numbers, fixed labels and buckets: no repository names,
        paths, file names, commit messages, queries or host names. Every field is listed in
        [docs/privacy-and-licensing.md](https://github.com/andreylukin/where-next/blob/main/docs/privacy-and-licensing.md).
        Please don't add anything else to it; a bot validates the JSON and rejects extra fields.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The JSON printed by `wn report --json` (pre-filled when you use `wn report`).
      render: json
    validations:
      required: true
